<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Review Fixture</title>
    <style>
      body { margin: 0; background: #f7f5f0; color: #1f2a33; font-family: system-ui, sans-serif; }
      .wrap { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
      .panel { background: #fff; border: 1px solid #ddd6c8; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
      h1 { font-size: 1.5rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Static Review Fixture</h1>
      <p>A self-contained page: no iframes, no served URLs, no browser storage.</p>
      <div class="panel">
        <h2>Decision A</h2>
        <p>Annotate this panel to test element selection.</p>
      </div>
      <div class="panel">
        <h2>Decision B</h2>
        <p>Second panel for multi-annotation tests.</p>
      </div>
    </div>
  </body>
</html>
